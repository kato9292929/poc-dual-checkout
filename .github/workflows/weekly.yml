name: weekly-report
on:
  schedule:
    # 毎週月曜 07:07 JST（日曜 22:07 UTC）に前週分を出す。日次（06:13 JST）の後に走る
    - cron: '7 22 * * 0'
  workflow_dispatch:
    inputs:
      week:
        description: 'YYYY-Www。空なら直前の週'
        required: false
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: report
        env:
          WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$WEEK" ]; then node scripts/report-weekly.mjs --week "$WEEK"; else node scripts/report-weekly.mjs; fi
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "reports: weekly $(ls -t reports/*.md | head -1 | xargs -I{} basename {} .md)"
          git push
